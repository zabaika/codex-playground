# Copy this file to runtime.local.toml and fill in machine-specific values there.
# Keep runtime.local.toml untracked.

[telegram]
# Default Telegram chat id used by manual send commands and as a fallback for chat allowlist.
default_chat_id = ""

[telethon]
user_session_name = "telegram_history_user"
bot_session_name = "telegram_history_bot"
api_id = "keychain://telegram-connector/api_id"
phone = "keychain://telegram-connector/phone"

[auth]
default_mode = "user"
public_channel_mode = "bot"
private_channel_mode = "user"

[bridge]
# Allowed Telegram chat ids. Empty = do not restrict by chat.
allowed_chat_ids = ""
# Allowed Telegram user ids from message.from.id. Empty = do not restrict by stable user id.
allowed_user_ids = ""
# Allowed Telegram usernames from message.from.username. Empty = do not restrict by username.
allowed_usernames = ""
# Preferred Telegram text message chunk size for long replies. Keep it below 4096.
text_chunk_size = "3900"
# Maximum number of latest ai_usage_log rows scanned by /agent-stats.
agent_stats_row_limit = "200"
# External ranking API used by /top-models.
top_models_api_url = "https://shir-man.com/api/free-llm/top-models"
# Network timeout in seconds for one /top-models attempt.
top_models_timeout_seconds = "15"
# Default number of rows returned by /top-models when limit is omitted.
top_models_default_limit = "5"
# In-memory cache TTL in seconds for /top-models inside the bridge process.
top_models_cache_ttl_seconds = "300"
# history_client_path = "/absolute/path/to/telegram_history_client.py"

[channels]
default_list = [
  "@vcnews, vc.ru",
]

[processing]
# Default AI model for analysis commands.
model = "gpt-5.4-mini"
# Whether processing flows should download image media and run OCR by default.
ocr = "true"

[digest]
# Time in local machine time for the daily launchd digest schedule.
time = "08:00"
# Hard wall-clock TTL in seconds for the whole one-shot digest run.
# Enforced outside Python at the process-group boundary so a stuck Telethon cleanup cannot leave launchd in state=running forever.
run_total_timeout_seconds = "1800"
# Grace period in seconds between SIGTERM and SIGKILL when the hard digest TTL expires.
termination_grace_seconds = "10"
# Wall-clock timeout in seconds for the whole digest prep-sync stage across all channels.
# This is a soft in-process timeout for prep-sync diagnostics, not the outer hard process TTL above.
sync_total_timeout_seconds = "1800"
# Optional separator appended to the end of each digest message. Leave empty to disable.
separator_text = "──────────────────────────────\n──────────────────────────────"
# Default analysis window start. Supports today, yesterday, week, month, and -Nd.
since = "yesterday"
# Default analysis window end. Uses the same aliases as since and expands date-only values to the end of that UTC day.
until = "yesterday"
# History sync mode before analysis: backfill = historical range, tail = latest window, update = only new messages.
sync_mode = "update"
# Minimum number of messages in one channel for AI analysis.
# If fewer messages are found, digest only syncs them and sends a short Telegram note without calling OpenAI.
min_messages_for_ai = "1"
# Whether digest prep-sync should mark the already-processed range as read using the existing read mechanism.
mark_read = "true"

[digest_ai]
# Maximum number of stored Telegram messages allowed in one AI pass.
# If the whole channel window has no more messages than this and also fits the shared block budget below,
# digest uses one direct AI request; otherwise the same value becomes the fallback chunk size for hierarchical batching.
messages_per_ai_pass = "500"
# Maximum number of characters from the main Telegram message text kept for one stored message row.
message_text_max_chars = "450"
# Maximum number of characters from OCR text kept for one stored message row.
message_ocr_max_chars = "300"
# Maximum total size of one rendered AI input block in characters for one channel, regardless of digest period.
message_block_max_chars = "100000"

[digest_limits.day]
# Recommended defaults for a daily window when the total traffic across all channels is about 5000 messages/day.
sync_limit = "6000"

[digest_limits.week]
# Recommended defaults for a 7-day window with the same traffic assumption.
sync_limit = "42000"

[digest_limits.month]
# Recommended defaults for a 30-day window with the same traffic assumption.
sync_limit = "180000"

[sync]
# Total Telegram download cap across all selected channels for one non-digest sync run.
# Set 0 to disable the shared cap and rely only on the command's own --limit.
sync_limit = "6000"
# Default per-channel limit for sync --mode backfill when --limit is omitted.
backfill_limit = "100"
# Default per-channel limit for sync --mode tail when --limit is omitted.
tail_limit = "100"
# Default per-channel limit for sync --mode update when --limit is omitted.
update_limit = "100"
# Maximum number of prepared message writes held in memory before one short SQLite flush transaction.
# Set 0 to flush each prepared write unit immediately instead of batching in memory.
batch_size = "500"

[digest_prompts]
# Path to the version-controlled digest prompt bundle.
# Relative paths are resolved from the config directory that contains runtime.local.toml.
file = "digest_prompts.toml"

[paths]
# Add local-only absolute paths here when needed.
# data_dir = "/absolute/path/to/telegram_connector/data"
# history_db = "/absolute/path/to/telegram_history.sqlite3"
# media_root = "/absolute/path/to/telegram_media"
# tesseract_binary = "/opt/homebrew/bin/tesseract"

[ocr]
image_prompt = "Extract all readable text from the image."

[secrets]
# macOS Keychain generic-password references via `security find-generic-password`
bot_token = "keychain://telegram-connector/bot_token"
api_hash = "keychain://telegram-connector/api_hash"
user_password = "keychain://telegram-connector/user_password"
openai_api_key = "keychain://telegram-connector/openai_api_key"
