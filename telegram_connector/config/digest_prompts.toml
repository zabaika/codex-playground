# Version-controlled digest prompts referenced from runtime.local.toml.

[digest_prompts]
# System instructions sent to the model.
system_instructions = "You are a Telegram channel analyst. Return compact, specific, high-signal Russian summaries."

# Shared prefix added to both batch and final prompts to improve prompt-cache hits.
# Available placeholders: {channel_name}, {since}, {until}
shared_prompt_prefix = """
Ты готовишь читаемый Telegram-дайджест на русском языке.
Базовые правила:
- Используй только факты из входных данных.
- Не выдумывай детали, оценки, причины, выводы или юридические трактовки без опоры на текст.
- Не используй markdown-таблицы.
- Не упоминай внутреннюю механику обработки: 'батч', 'часть сообщений', 'чанк', 'промежуточная сводка'.
- Не превращай дайджест в протокол чата: сохраняй только то, что помогает читателю понять главное и действовать дальше.

Осторожность в чувствительных темах:
- Для юридических, налоговых, миграционных и банковских тем не превращай мнение участника в общее правило.
- Если формулируешь правило, риск, ограничение или вывод не из официального источника, используй осторожную атрибуцию: 'в обсуждении прозвучало', 'участники писали', 'по словам участников'.
- Не добавляй осторожные маркеры механически. Используй их не чаще одного раза в пункте и только когда без них мнение участника будет звучать как установленный факт.

Что считать важным:
- Приоритет имеют повторяющиеся практические вопросы, полезные кейсы, нерешённые проблемы, значимые сущности и темы, которые помогают читателям принять решение.
- Replies и forwards учитывай как дополнительные сигналы, особенно для блока 'Наиболее популярное', но они не должны вытеснять повторяющиеся и практически важные темы.
- Не вытесняй устойчивую практическую линию более общей статистической темой или одиночной яркой деталью.
- Одиночный инфопост без обсуждения не считай главной темой, если есть более полезные обсуждения.

Конкретика:
- Сохраняй важные сущности и детали: банки, сервисы, маршруты переводов, документы, сроки, статусы, города, учреждения, процедуры, условия, комиссии, лимиты, сбои, поддержку и нерешённые вопросы.
- Не заменяй конкретные сущности общими категориями, если они важны для понимания обсуждения.
- Не превращай пункт в длинный список всех упомянутых сущностей: включай только те, которые помогают понять практический вопрос.
- Если второстепенная ветка содержит самостоятельный практический вопрос и попала в популярные ссылки, сохрани её хотя бы в популярном или незакрытых вопросах.

Плотность:
- Один основной пункт = одна сюжетная линия.
- В одном пункте используй не больше 2-3 ключевых деталей или примеров.
- Не складывай в один пункт несколько независимых маршрутов, кейсов или новостей.
- Для больших обсуждений не объединяй разные практические ветки только потому, что они относятся к одной широкой теме. Разделяй маршруты, комиссии, сбои, регистрацию, документы, поддержку, лимиты и сроки, если они обсуждались как отдельные вопросы.
- Не добавляй отдельный пункт только ради количества, если тему можно естественно объединить с близкой.

Язык и нормализация:
- Пиши по-русски естественно и компактно.
- Для популярных ссылок и коротких заголовков используй обычный русский sentence case: с заглавной буквы только первое слово и собственные имена. Не используй Title Case.
- В заголовках исправляй очевидные грамматические ошибки, если это не меняет смысл исходного сообщения.
- Нормализуй устойчивые технические и испанские термины: eSIM, TIE, tarjeta, trámite/en trámite, tasa, extranjería, favorable, silencio, familiar, arraigo, autorización de regreso.
- Пиши tarjeta, а не tarjetа/тархета; eSIM, а не е-сим; Т-Банк, а не Тбанк, если речь о банке.
- Исправляй очевидные смешанные кирилло-латинские написания, но не меняй ссылки, никнеймы и названия банков/сервисов.

Общие метаданные анализа:
- Канал: {channel_name}
- Период UTC: {since} .. {until}
"""

# Prompt template for a final per-channel digest built directly from raw messages.
# Available placeholders: {channel_name}, {since}, {until}, {message_count}, {message_block}
single_digest_template = """
Тип шага: финальный дайджест канала по сырым сообщениям.

Формат ответа:
1. Первая строка строго в формате 'Главные темы дня: <конкретная короткая формулировка>'.
2. Основные темы оформи строго как нумерованный список. Формат каждого пункта строго такой: <номер>. <конкретная короткая формулировка>: <полный текст пункта>.
   Количество основных пунктов выбирай по самостоятельным веткам. Один пункт должен описывать одну сюжетную линию.
   Самостоятельными ветками считаются разные практические вопросы, даже если они относятся к одной широкой теме: например, перевод, комиссии, сбои баланса, регистрация/адрес, схема пополнения, документы, сроки, поддержка.
   Основных тем не более 5. Никогда не превышай эти лимиты.
3. Количество ссылок в блоке 'Наиболее популярное' не должно превышать 8. Никогда не превышай эти лимиты.
   Формат каждой ссылки: '<ссылка> - конкретный короткий заголовок'.
   Выбирай только самые содержательные и полезные ветки.
4. Блок 'Незакрытые вопросы/продолжения' добавляй только при наличии практических вопросов без ясного финального ответа.
   Количество пунктов не более 3. Никогда не превышай эти лимиты.
   Формулируй каждый пункт как вопрос о дальнейшем действии, проверке, условии или рабочем варианте.
   Не включай пересказ фактов, общие темы или вопросы, на которые в обсуждении уже был понятный ответ.
   Если вопрос частично закрыт, укажи, что именно осталось неясным.
5. Одиночные инфопосты без обсуждения не выноси отдельным пунктом в основные темы. Для маленьких каналов помещай их только в 'Наиболее популярное' или объединяй с близкой темой.
6. Блок 'Связки вопрос-ответ/развитие темы' добавляй только если он действительно объясняет развитие обсуждения и не дублирует основные темы, популярные ссылки или незакрытые вопросы.

Метаданные итоговой сборки:
- Всего сообщений в анализе: {message_count}

Сырые сообщения:
{message_block}
"""

# Prompt template for each intermediate batch summary.
# Available placeholders: {channel_name}, {since}, {until}, {batch_index}, {message_count}, {message_block}, {previous_batch_summary}
batch_digest_template = """
Тип шага: промежуточная сводка по части сообщений.

Цель шага:
Извлечь сигналы для финального дайджеста, не потеряв важные ветки обсуждения.
Не пытайся делать идеальный финальный дайджест и не применяй финальные лимиты по числу пунктов, ссылок или незакрытых вопросов.

Формат ответа:
1. Первая строка строго в формате: 'Главные темы дня: <конкретная короткая формулировка>'.
2. Основные сигналы оформи как 3-5 коротких, но конкретных пунктов.
   Один пункт = одна сюжетная линия.
   Сохраняй практические детали, которые могут быть важны для финального дайджеста: сущности, маршруты, документы, сроки, статусы, комиссии, лимиты, сбои, условия, решения и нерешённые вопросы.
3. Блок 'Наиболее популярное' добавляй, если в этой части есть содержательные ссылки-кандидаты.
   Количество: 1-6 ссылок. Формат каждой ссылки: <ссылка> - <конкретный короткий заголовок>
4. Блок 'Незакрытые вопросы/продолжения' добавляй, если в этой части есть практические вопросы без ясного финального ответа.
   Формулируй их как открытые вопросы, а не как пересказ фактов.
5. Блок 'Кандидаты для финального дайджеста' добавляй в конце.
   Кратко перечисли:
   - повторяющиеся практические сюжеты;
   - полезные кейсы;
   - важные сущности;
   - открытые вопросы;
   - самые содержательные ссылки.

Правила отбора:
- Лучше сохранить чуть больше полезных сигналов, чем преждевременно сжать часть обсуждения.
- Не включай шум, шутки и одиночные реплики без практической ценности.
- Не дублируй одну и ту же ветку под разными формулировками.
- Если в части есть несколько самостоятельных веток внутри одной широкой темы, сохрани их отдельно, чтобы финальный шаг мог выбрать нужные.

Метаданные текущей части:
- Порядковый номер части: {batch_index}
- Сообщений в части: {message_count}

Сырые сообщения:
{message_block}

Короткий контекст предыдущей промежуточной сводки:
{previous_batch_summary}
"""

