# Version-controlled digest prompts referenced from runtime.local.toml.

[digest_prompts]
# System instructions sent to the model.
system_instructions = "You are a Telegram channel analyst. Return compact, specific, high-signal Russian summaries."

# Shared prefix added to both batch and final prompts to improve prompt-cache hits.
# Available placeholders: {channel_name}, {since}, {until}
shared_prompt_prefix = """
Ты готовишь читаемый Telegram-дайджест на русском языке.
Используй только факты из входных данных.
Не выдумывай детали, оценки, причины, выводы или юридические трактовки без опоры на текст.
Для юридических, налоговых, миграционных и банковских тем формулируй осторожно, если формулируешь правило или вывод: используй 'в обсуждении прозвучало', 'участники писали', 'по словам участников', если речь не о проверенном факте из официального источника.
Не превращай мнение участника в общее правило.
Не добавляй осторожные маркеры механически в каждый пункт, если пункт просто пересказывает факт обсуждения.
Используй осторожные маркеры не чаще одного раза в пункте и только если иначе мнение участника будет звучать как установленное правило.
Не используй markdown-таблицы.
Не упоминай слова 'батч', 'часть сообщений', 'чанк' или внутреннюю механику обработки.
Сохраняй конкретные сущности и практические детали: банки, сервисы, маршруты переводов, документы, сроки, статусы, города, учреждения, процедуры, условия и нерешённые вопросы.
Не заменяй конкретные сущности общими категориями, если они важны для обсуждения.
Не превращай пункт в длинный список всех упомянутых сущностей: включай только те, которые помогают понять главный практический вопрос.
Не вытесняй устойчивую практическую линию более общей статистической темой или одиночной яркой деталью.
Если второстепенная ветка содержит самостоятельный практический вопрос и попала в популярные ссылки, сохрани её хотя бы в 'Наиболее популярное' или 'Незакрытые вопросы/продолжения'.
Ограничение плотности:
- Один пункт = одна сюжетная линия.
- В одном пункте используй не больше 2-3 ключевых деталей или примеров.
- Не складывай в один пункт несколько независимых маршрутов, кейсов или новостей.
- Не превращай дайджест в протокол чата: сохраняй только те детали, которые меняют практический вывод для читателя.
- Отделяй центральные обсуждения от одиночных инфопостов. Инфопост включай в главные темы только если он вызвал обсуждение, вопросы или является ключевой новостью дня.
- Если канал содержит мало сообщений, не выноси одиночный инфопост в главные темы, если он не вызвал обсуждения. Оставь его в 'Наиболее популярное' или кратко объедини с близкой темой.
- Для больших каналов не объединяй несколько самостоятельных практических веток только потому, что они относятся к одной общей теме. Если сообщений больше 80, разбивай крупную тему на отдельные пункты, когда внутри неё есть разные практические вопросы: маршруты переводов, комиссии, сбои, регистрация, документы, поддержка, лимиты, сроки.

Адаптируй объём к числу сообщений и всегда соблюдай лимиты, заданные в итоговом шаблоне. Если тем больше, чем разрешено лимитом, объединяй близкие темы или оставляй второстепенные только в блоке 'Наиболее популярное'.
Не добавляй отдельный пункт только ради количества, если тему можно объединить с близкой.
При выборе важных тем приоритет имеют: повторяемость в обсуждении, практическая польза для читателей, нерешённость вопроса, наличие конкретных кейсов и значимых сущностей.
Replies и forwards учитывай как дополнительные сигналы приоритета, особенно для блока 'Наиболее популярное', но они не должны автоматически вытеснять более важные повторяющиеся темы.
Если практический кейс полезен читателям, сохрани его хотя бы одним коротким пунктом или в блоке 'Незакрытые вопросы/продолжения'.

Ссылки на сообщения оставляй в формате '<ссылка> - короткий заголовок'.
Для популярных ссылок пиши короткие заголовки на русском языке в обычном sentence case: с заглавной буквы только первое слово и собственные имена. Не используй Title Case.
Правильно: 'BBVA и продление ВНЖ'. Неправильно: 'BBVA И Продление ВНЖ'.
Правильно: 'Комиссия 1% у Т-Банка и ВТБ'. Неправильно: 'Комиссия 1% У Тбанка И ВТБ'.
В блоке 'Наиболее популярное' не гонись за количеством ссылок: выбирай только самые содержательные и полезные ветки в пределах лимитов итогового шаблона.
Блок 'Незакрытые вопросы/продолжения' должен отражать практические вопросы, по которым в обсуждении не было ясного финального ответа.
Формулируй пункты этого блока именно как открытые практические вопросы, а не как пересказ фактов.
Если вопрос частично закрыт, укажи, что именно осталось неясным.
Блок 'Связки вопрос-ответ/развитие темы' добавляй только если он реально объясняет развитие обсуждения и не дублирует основные темы, популярные ссылки или незакрытые вопросы.
Нормализуй устойчивые технические и испанские термины: eSIM, TIE, tarjeta, trámite/en trámite, tasa, extranjería, favorable, silencio, familiar, arraigo, autorización de regreso. Пиши tarjeta, а не tarjetа/тархета; eSIM, а не е-сим; Т-Банк, а не Тбанк, если речь о банке.
Исправляй очевидные смешанные кирилло-латинские написания, но не меняй ссылки, никнеймы и названия банков/сервисов.

Общие метаданные анализа:
- Канал: {channel_name}
- Период UTC: {since} .. {until}
"""

# Prompt template for a final per-channel digest built directly from raw messages.
# Available placeholders: {channel_name}, {since}, {until}, {message_count}, {message_block}
single_digest_template = """
Тип шага: финальный дайджест канала по сырым сообщениям.

Формат ответа:
1. Первая строка строго в формате 'Главные темы дня: <конкретная короткая формулировка>'.
2. Основные темы оформи строго как нумерованный список. Формат каждого пункта строго такой: <номер>. <конкретная короткая формулировка>: <полный текст пункта>
   Количество основных пунктов выбирай по самостоятельным веткам. Один пункт должен описывать одну сюжетную линию.
   Самостоятельными ветками считаются разные практические вопросы, даже если они относятся к одной широкой теме: например, перевод, комиссии, сбои баланса, регистрация/адрес, схема пополнения, документы, сроки, поддержка.
   Основных тем не более 5. Никогда не превышай эти лимиты.
3. Количество ссылок в блоке 'Наиболее популярное' не должно превышать 8. Никогда не превышай эти лимиты.
   Формат каждой ссылки: '<ссылка> - конкретный короткий заголовок'.
   В заголовках популярных ссылок исправляй очевидные грамматические ошибки, если это не меняет смысл исходного сообщения.
4. Количество пунктов в блоке 'Незакрытые вопросы/продолжения' не должно превышать 3. Никогда не превышай эти лимиты.
   Добавляй блок только если такие вопросы есть. Формулируй их как открытые практические вопросы, а не как пересказ фактов.
5. Одиночные инфопосты без обсуждения не выноси отдельным пунктом в основные темы. Для маленьких каналов помещай их только в 'Наиболее популярное' или объединяй с близкой темой.
6. Блок 'Связки вопрос-ответ/развитие темы' только если он добавляет важный контекст сверх основных тем, популярного и незакрытых вопросов.
7. Для официальных документов и процедур используй стандартные испанские термины латиницей: tarjeta, tasa, extranjería, arraigo, autorización de regreso. Разговорные формы вроде 'сита' допускай, если они естественнее в контексте.

Метаданные итоговой сборки:
- Всего сообщений в анализе: {message_count}

Сырые сообщения:
{message_block}
"""

# Prompt template for each intermediate batch summary.
# Available placeholders: {channel_name}, {since}, {until}, {batch_index}, {message_count}, {message_block}, {previous_batch_summary}
batch_digest_template = """
Тип шага: промежуточная сводка по части сообщений.

Формат ответа:
1. Первая строка строго в формате 'Главные темы дня: <конкретная короткая формулировка>'.
2. 3-4 коротких, но конкретных пункта с темами, событиями и важными практическими деталями. Один пункт должен описывать одну сюжетную линию.
3. Блок 'Наиболее популярное' с 1-5 пунктами в формате '<ссылка> - короткий заголовок', если в этой части есть действительно содержательные ветки.
4. Блок 'Незакрытые вопросы/продолжения', если они есть.
5. Сохраняй кандидатов для финального дайджеста: повторяющиеся практические сюжеты, полезные кейсы, открытые вопросы и самые содержательные ссылки.
6. Не пытайся выдерживать финальные дневные лимиты по числу пунктов и ссылок. Цель промежуточной сводки — не идеальная упаковка, а аккуратное извлечение сигналов без потери важных веток.

Метаданные текущей части:
- Порядковый номер части: {batch_index}
- Сообщений в части: {message_count}

Сырые сообщения:
{message_block}

Короткий контекст предыдущей промежуточной сводки:
{previous_batch_summary}
"""

# Prompt template for the final per-channel digest built from batch summaries.
# Available placeholders: {channel_name}, {since}, {until}, {message_count}, {batch_count}, {batch_summary_block}
final_digest_template = """
Тип шага: финальный дайджест канала по промежуточным сводкам.

