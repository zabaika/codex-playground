# Copy this file to runtime.local.toml and fill in machine-specific values there.
# Keep runtime.local.toml untracked.

[note_roots]
article = "/absolute/path/to/Ideas"
concept = "/absolute/path/to/Ideas/Concepts"

[paths]
# Keep temporary and staging files for this skill under scratch/, not repo-local tmp/.
scratch_root = "scratch/article-to-obsidian-kb"
# Point to the canonical kb-index runtime config when indexed note retrieval is available.
# Prefer a project-root-relative path and keep absolute paths as a local fallback only.
# kb_index_config = "tools/kb-index/config/runtime.local.toml"
# Add other local-only absolute paths here when the skill needs them.
# vault_root = "/absolute/path/to/vault"

[secrets]
# Add local-only credentials here only when a future workflow needs them.
# api_token = ""
# vault_password = ""
