# Copy this file to runtime.local.toml and fill in machine-specific values there.
# Keep runtime.local.toml untracked.
# Resolve this file relative to the active skill directory, not the current shell cwd.

[note_roots]
# Required source-mode roots.
# `article` is used for `lessons`, `general`, and `operating-model` notes.
article = "/absolute/path/to/Ideas"
# `concept` is used for reusable concept notes.
concept = "/absolute/path/to/Ideas/Concepts"

[structured_note_roots]
# Optional destination root for council verdict notes when structured mode is used.
# Keep this separate from source-derived and concept roots.
# Structured mode must be selected explicitly. Do not infer it from the payload shape.
council_verdict = "/absolute/path/to/Ideas/LLM Council results"

[paths]
# Optional absolute project-root override used when installed-copy runtime
# must still relativize project-local `source` artifacts such as
# `scratch/llm-council/council-payload-...json`.
# Also use this when multiple local anchors could imply different project roots
# and you want one explicit canonical base.
# `CODEX_PLAYGROUND_PROJECT_ROOT` takes precedence over this key when both exist.
# project_root = "/absolute/path/to/Playground"
# Keep temporary and staging files for this skill under scratch/, not repo-local tmp/.
# If omitted, the skill defaults to `scratch/article-to-obsidian-kb`.
scratch_root = "scratch/article-to-obsidian-kb"
# Point to the canonical kb-index runtime config when indexed note retrieval is available.
# Prefer a project-root-relative path and keep absolute paths as a local fallback only.
# When configured and healthy, retrieval should prefer kb-index before broad direct vault search.
# The same config is also the canonical target for the single post-write kb-index sync.
# kb_index_config = "tools/kb-index/config/runtime.local.toml"
# Add other local-only absolute paths here when the skill needs them.
# vault_root = "/absolute/path/to/vault"

[secrets]
# Add local-only credentials here only when a future workflow needs them.
# Never commit real secrets into tracked config files.
# api_token = ""
# vault_password = ""
