# Copy to runtime.local.toml only if you need local overrides for this orchestration layer.
# Keep runtime.local.toml untracked.
# Resolve this file relative to the active skill directory, not the current shell cwd.

[skills]
# Reuse the sibling skill configs instead of duplicating their machine-specific values here.
# Keep these as config pointers only; do not copy transcript-engine settings or note roots here.
youtube_transcribe_config = "../../youtube-transcribe-skill/config/runtime.local.toml"
article_to_obsidian_config = "../../article-to-obsidian-kb/config/runtime.local.toml"

[paths]
# Project-root-relative paths follow RULEBOOK.md.
# Resolution order for the base directory:
# 1. CODEX_PLAYGROUND_PROJECT_ROOT
# 2. [paths].project_root
# 3. sibling article-to-obsidian-kb project-root resolution
# 4. repo-root inference from the skill location
# Leave `project_root` empty unless you need to override automatic resolution.
project_root = ""
# Prepared transcript markdown files should stay under scratch/, not repo-local tmp/.
prepared_transcripts_dir = "scratch/youtube-to-obsidian-kb"
# Keep wrapper logs under scratch/ too so cleanup remains one-directory scoped.
log_file = "scratch/youtube-to-obsidian-kb.log"
