# Copy this file to runtime.local.toml and fill in machine-specific values there.
# Keep runtime.local.toml untracked.

[telegram]
# Default Telegram chat id used by manual send commands and as a fallback for chat allowlist.
default_chat_id = ""

[bridge]
# Allowed Telegram chat ids. Empty = do not restrict by chat.
allowed_chat_ids = ""
# Allowed Telegram user ids from message.from.id. Empty denies bridge commands unless usernames are configured.
allowed_user_ids = ""
# Allowed Telegram usernames from message.from.username. Empty denies bridge commands unless user ids are configured.
allowed_usernames = ""
default_command = "agent"
# Preferred Telegram text message chunk size for long replies.
# Values are clamped to 500..4096; 4096 is Telegram's text-message limit.
text_chunk_size = "3900"
# Maximum number of latest ai_usage_log rows scanned by /agent-stats.
# Values are clamped to 1..2000.
agent_stats_row_limit = "200"
# Wall-clock timeout in seconds for one bridge-launched agent worker subprocess.
# Values are clamped to 60..14400.
worker_process_timeout_seconds = "3600"
# Number of Telegram sendMessage attempts for transient network failures in one outbound message send.
# Values are clamped to 1..5.
send_message_retry_attempts = "3"
# Base backoff in seconds between Telegram sendMessage retries; the wait grows linearly per retry.
# Values are clamped to 0..30.
send_message_retry_backoff_seconds = "2"
# worker_path = "/absolute/path/to/telegram_agent_worker.py"

[agent]
# OpenAI model used by the agent worker.
model = "gpt-5.4-mini"
# Maximum number of tool-call rounds in one agent run. Values are clamped to 1..16.
max_tool_rounds = "8"
# Network timeout in seconds for one OpenAI Responses API request from the agent worker. Values are clamped to 30..600.
openai_timeout_seconds = "180"
# Number of OpenAI Responses API retry attempts for transient network/OS, HTTP 408, retryable HTTP 429, HTTP 500/502/503/504, and edge/origin HTTP 520-525/530 failures.
# Values are clamped to 1..5.
openai_retry_attempts = "3"
# Base delay in seconds for OpenAI retries. The delay grows exponentially with jitter; Retry-After overrides it when OpenAI supplies that header.
# Values are clamped to 0..60.
openai_retry_backoff_seconds = "1"
# Maximum number of web search hits returned by one search tool call. Values are clamped to 1..10.
web_search_limit = "5"
# Maximum number of plain-text characters kept from one fetched page. Values are clamped to 1000..30000.
fetch_char_limit = "12000"
# Timeout in seconds for one local ripgrep search tool call. Values are clamped to 1..300.
local_search_timeout_seconds = "30"
# Timeout in seconds for one public web search tool call. Values are clamped to 1..300.
web_search_timeout_seconds = "30"
# Timeout in seconds for one public URL fetch tool call. Values are clamped to 1..300.
fetch_url_timeout_seconds = "30"
# Maximum number of local search hits returned by one search_local_files call. Values are clamped to 1..200.
# Increase carefully: larger values make tool outputs heavier and can increase token cost.
max_local_matches = "50"
# Maximum number of numbered lines returned by one read_local_file call. Values are clamped to 1..2000.
# Increase carefully for large files; this affects both latency and payload size.
max_file_lines = "400"
# Maximum number of files/folders returned by one list_local_files call. Values are clamped to 1..1000.
# Keep this moderate so directory listings stay readable in Telegram and in tool context.
max_directory_entries = "200"
# Maximum number of characters sent back to OpenAI for one tool result. Values are clamped to 1000..200000.
# This is the main guardrail against HTTP 400 from oversized function_call_output payloads.
max_tool_output_chars = "50000"
# Prompt-cache scope for OpenAI requests: "global" reuses cache across all chats on this bot,
# "chat" isolates cache keys per Telegram chat_id.
prompt_cache_scope = "global"
# Store full OpenAI agent prompt/tool-round text in ai_usage_log.prompt_text for temporary debugging.
# Keep false by default to avoid persisting user prompts and tool outputs in SQLite.
store_prompt_text = "false"
# Local roots the agent may inspect. Relative paths are resolved from telegram_agent_bot/.
allowed_roots = [
  ".",
]

[agent_prompts]
system_instructions = """
Ты Telegram-агент для локальной рабочей машины.
Отвечай строго на русском языке, используя английский только для терминов, API-названий и имён собственных.
Можно использовать только настроенные локальные папки и публичные веб-страницы.
Если нужны дополнительные доступы к папкам, токены, логины или другие секреты, сначала попроси их в чате и предложи сохранить в macOS Keychain.
Если нужно создать файлы, сначала спроси, куда их положить, и предложи 1-3 разумных пути.
Если не хватает функционала, сначала предложи поискать и установить готовый skill или готовую интеграцию, а не создавать всё с нуля.
Опирайся на результаты инструментов. Если данных недостаточно, говори об этом прямо.
Для Telegram используй простую устойчивую структуру: короткие секции, плоские списки, без таблиц и без перегруженного форматирования.
Финальные ответы делай короткими, практичными и пригодными для Telegram.
"""

[secrets]
bot_token = "keychain://telegram-agent-bot/bot_token"
openai_api_key = "keychain://telegram-agent-bot/openai_api_key"
